name: deploy

# 日报数据（或站点代码）有变更即重建部署 Pages。
# inbox 只是中间产物，不触发部署。

on:
  push:
    branches: [main]
    paths:
      - 'data/issues/**'
      - 'data/items/**'
      - 'data/events/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build site
        run: |
          cd site
          npm ci || npm install
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - uses: actions/deploy-pages@v4
        id: deployment
