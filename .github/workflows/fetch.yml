name: fetch

# 海外源采集（Actions 海外 runner 免费）→ data/inbox 提交；
# 过渡期（国内服务器未就绪）在同一任务里直接跑完整管线（stopgap），
# 服务器接管后把仓库变量 STOPGAP_PIPELINE 设为 0，本流程退回只写 inbox。

on:
  schedule:
    # GitHub 高负载期会静默延迟/丢弃定时触发（冷门分钟也难幸免），
    # 因此铺多个冗余时段：第一个成功的出刊，其余幂等跳过（已出刊/无新数据均无副作用）。
    - cron: '13 0 * * *' # 主时段：北京时间 08:13
    - cron: '47 1 * * *' # 备份：北京时间 09:47
    - cron: '23 4 * * *' # 备份：北京时间 12:23
    - cron: '9 7 * * *' # 兜底：北京时间 15:09（整个上午被丢弃时当天仍能出刊）
  workflow_dispatch:

permissions:
  contents: write
  actions: write # 数据提交后主动 dispatch deploy

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch overseas sources into inbox
        run: |
          pip install -r collector/requirements.txt
          python -m collector.fetch

      - name: Run full pipeline (stopgap until server takes over)
        # 陷阱：GitHub 对不同类型比较会转数字，未设变量(null=0) 与 '0' 相等——
        # 必须补「未设 = 开启」分支，否则 stopgap 在默认状态下永远被跳过
        if: vars.STOPGAP_PIPELINE != '0' || vars.STOPGAP_PIPELINE == ''
        run: python -m collector.pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SCORE_MODEL: ${{ vars.SCORE_MODEL }}
          WRITE_MODEL: ${{ vars.WRITE_MODEL }}

      - name: Commit inbox & issue data
        id: commit
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "pushed=0" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: issue $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase origin main && git push
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 的 push 不会触发其他工作流（防递归），数据提交后
      # 必须主动 dispatch deploy 才能自动上线（workflow_dispatch 是豁免通道）
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == '1'
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
